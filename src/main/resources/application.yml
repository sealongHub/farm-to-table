spring:
  application:
    name: farm-to-table

  datasource:
    url: jdbc:postgresql://localhost:8080/farm_to_table
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000